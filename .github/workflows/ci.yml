name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y binutils-mips-linux-gnu ripgrep
      - run: ci/check
        env:
          N64LINK_GNU_AS: mips-linux-gnu-as
